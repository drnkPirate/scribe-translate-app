name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
          npm ci
          .venv\Scripts\python scripts/create_icon.py
      - name: Check
        run: npm test
      - name: Build installer
        run: npm run build:win
      - name: Verify bundle and report installer size
        shell: pwsh
        run: |
          .venv\Scripts\python scripts/check_bundle.py
          $installer = Get-ChildItem "release/Scribe-Translate-*-Setup.exe" | Select-Object -First 1
          "Installer bytes: $($installer.Length)"
          "## Installer size`n`n$($installer.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
      - name: Smoke-test installed app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release/Scribe-Translate-*-Setup.exe" | Select-Object -First 1).FullName
          ./scripts/smoke_windows_installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: Scribe-Translate-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem "release/Scribe-Translate-*-Setup.exe" | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $installer --generate-notes --title "Scribe Translate $env:GITHUB_REF_NAME"
